name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The wheel force-includes ui/dist as the packaged console, so it must
      # exist before uv sync builds the editable install (and before uv build).
      - run: npm ci && npm run build
        working-directory: ui
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Test the declared floor (requires-python = >=3.12), not whatever
          # interpreter the runner image happens to provide.
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest --cov=loopforge --cov-branch --cov-report=term-missing
      - run: uv build

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
