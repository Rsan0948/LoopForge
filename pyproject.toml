[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loopforge-console"
version = "0.2.0"
description = "A bounded, replayable, observable runtime for autonomous software-engineering agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ruben Sanchez" }]
keywords = ["agents", "runtime", "console", "replay", "verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28.1",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/Rsan0948/LoopForge"
Repository = "https://github.com/Rsan0948/LoopForge"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6.112,<7",
  "ruff>=0.12,<1",
  "pyright>=1.1.400,<2",
  "import-linter>=2.3,<3",
  # Starlette's TestClient is statically typed against httpx2 (a TYPE_CHECKING
  # import); without it pyright-strict sees every TestClient call as Unknown.
  "httpx2>=2.12",
]

[project.scripts]
loopforge = "loopforge.entrypoints.cli:main"
loopforge-console = "loopforge.entrypoints.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loopforge"]

# Ship the prebuilt console UI in the wheel so `loopforge console` works with
# zero extra tooling (no npm). ui/dist is a gitignored build product — run
# `cd ui && npx vite build` before `uv build`.
[tool.hatch.build.targets.wheel.force-include]
"ui/dist" = "loopforge/console_static"

# Keep ui/dist at the same path inside the sdist so wheels built FROM the
# sdist pick the console assets up through the same force-include rule.
[tool.hatch.build.targets.sdist.force-include]
"ui/dist" = "ui/dist"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "C4", "DTZ", "EM", "FA", "ISC", "LOG", "G",
  "PIE", "PT", "RET", "RSE", "SIM", "TID", "ARG", "PTH", "ERA", "PL", "TRY",
  "PERF", "FURB", "RUF"
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
# Check against the declared floor (requires-python = >=3.12) regardless of the
# interpreter the local venv happens to run, so 3.13+ stdlib APIs fail locally
# instead of only in CI.
pythonVersion = "3.12"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["loopforge"]
omit = ["src/loopforge/adapters/_sandbox_exec.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.importlinter]
root_package = "loopforge"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core dependency layers"
type = "layers"
layers = [
  "loopforge.entrypoints",
  "loopforge.workloads",
  "loopforge.application",
  "loopforge.ports",
  "loopforge.domain",
]

[[tool.importlinter.contracts]]
name = "Adapters do not depend on entrypoints"
type = "forbidden"
source_modules = ["loopforge.adapters"]
forbidden_modules = ["loopforge.entrypoints"]
