[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loopforge"
version = "0.1.0"
description = "A bounded, replayable, observable runtime for autonomous software-engineering agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ruben Sanchez" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28.1",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6.112,<7",
  "ruff>=0.12,<1",
  "pyright>=1.1.400,<2",
  "import-linter>=2.3,<3",
  # Starlette's TestClient is statically typed against httpx2 (a TYPE_CHECKING
  # import); without it pyright-strict sees every TestClient call as Unknown.
  "httpx2>=2.12",
]

[project.scripts]
loopforge = "loopforge.entrypoints.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loopforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "C4", "DTZ", "EM", "FA", "ISC", "LOG", "G",
  "PIE", "PT", "RET", "RSE", "SIM", "TID", "ARG", "PTH", "ERA", "PL", "TRY",
  "PERF", "FURB", "RUF"
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["loopforge"]
omit = ["src/loopforge/adapters/_sandbox_exec.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.importlinter]
root_package = "loopforge"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core dependency layers"
type = "layers"
layers = [
  "loopforge.entrypoints",
  "loopforge.workloads",
  "loopforge.application",
  "loopforge.ports",
  "loopforge.domain",
]

[[tool.importlinter.contracts]]
name = "Adapters do not depend on entrypoints"
type = "forbidden"
source_modules = ["loopforge.adapters"]
forbidden_modules = ["loopforge.entrypoints"]
